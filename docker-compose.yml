services:
  http1:
    image: nginx
    ports:
      - 1443:443
    volumes:
      - ./video-server/videos:/usr/share/nginx/html/media
      - ./video-server/http1.conf:/etc/nginx/conf.d/user.conf
      - ./video-server/nginx.conf:/etc/nginx/nginx.conf
      - ./video-server/localhost.crt:/etc/nginx/ssl/localhost.crt
      - ./video-server/localhost.key:/etc/nginx/ssl/localhost.key
  http2:
    image: nginx
    ports:
      - 2443:443
    volumes:
      - ./video-server/videos:/usr/share/nginx/html/media
      - ./video-server/http2.conf:/etc/nginx/conf.d/user.conf
      - ./video-server/nginx.conf:/etc/nginx/nginx.conf
      - ./video-server/localhost.crt:/etc/nginx/ssl/localhost.crt
      - ./video-server/localhost.key:/etc/nginx/ssl/localhost.key
  http3:
    image: nginx
    ports:
      - 8443:8443/tcp
      - 8443:8443/udp
    volumes:
      - ./video-server/videos:/usr/share/nginx/html/media
      - ./video-server/http3.conf:/etc/nginx/conf.d/user.conf
      - ./video-server/nginx.conf:/etc/nginx/nginx.conf
      - ./video-server/localhost.crt:/etc/nginx/ssl/localhost.crt
      - ./video-server/localhost.key:/etc/nginx/ssl/localhost.key

  http3-traefik:
    image: traefik
    ports:
      - 9080:80
      - 9443:443/tcp
      - 9443:443/udp
      - 8080:8080
    volumes:
      - ./video-server/traefik.yml:/etc/traefik/traefik.yml
      - ./video-server/localhost.crt:/etc/traefik/ssl/localhost.crt
      - ./video-server/localhost.key:/etc/traefik/ssl/localhost.key
      - /var/run/docker.sock:/var/run/docker.sock
  dash:
    build:
      context: ./dash.js
    ports:
      - 3000:3000
volumes:
  nginx_secrets: