services:
  nginx:
    image: nginx
    ports:
      - 80:80
    volumes:
      - ./video-server/videos:/usr/share/nginx/html/media
      - ./video-server/user.conf:/etc/nginx/user_conf.d/user.conf
      - ./video-server/nginx.conf:/etc/nginx/nginx.conf
      - nginx_secrets:/etc/letsencrypt
  mongo:
    image: mongo
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example

volumes:
  nginx_secrets: