services:
  http1:
    image: nginx
    ports:
      - 1443:443
    volumes:
      - ./video-server/videos:/usr/share/nginx/html/media
      - ./video-server/http1.conf:/etc/nginx/conf.d/user.conf
      - ./video-server/nginx.conf:/etc/nginx/nginx.conf
      - ./video-server/localhost.crt:/etc/nginx/ssl/localhost.crt
      - ./video-server/localhost.key:/etc/nginx/ssl/localhost.key
  http2:
    image: nginx
    ports:
      - 2443:443
    volumes:
      - ./video-server/videos:/usr/share/nginx/html/media
      - ./video-server/http2.conf:/etc/nginx/conf.d/user.conf
      - ./video-server/nginx.conf:/etc/nginx/nginx.conf
      - ./video-server/localhost.crt:/etc/nginx/ssl/localhost.crt
      - ./video-server/localhost.key:/etc/nginx/ssl/localhost.key
  http3:
    image: nginx
    ports:
      - 8443:8443/tcp
      - 8443:8443/udp
    volumes:
      - ./video-server/videos:/usr/share/nginx/html/media
      - ./video-server/http3.conf:/etc/nginx/conf.d/user.conf
      - ./video-server/nginx.conf:/etc/nginx/nginx.conf
      - ./video-server/localhost.crt:/etc/nginx/ssl/localhost.crt
      - ./video-server/localhost.key:/etc/nginx/ssl/localhost.key
      

  dash:
    build:
      context: ./dash.js
    ports:
      - 3000:3000
  dash-bola:
    build:
      context: ./dash.js-bola
    ports:
      - 3001:3000
  dash-festive:
    build:
      context: ./dash.js-festive
    ports:
      - 3002:3000
  dash-l2a:
    build:
      context: ./dash.js-l2a
    ports:
      - 3003:3000
  dash-rb:
    build:
      context: ./dash.js-rb
    ports:
      - 3004:3000
  dash-throughput:
    build:
      context: ./dash.js-throughput
    ports:
      - 3005:3000
    # network_mode: host
volumes:
  nginx_secrets: