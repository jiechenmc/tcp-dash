server {
    listen 443 ssl;
    http2 on;

    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/localhost.crt;
    ssl_certificate_key /etc/nginx/ssl/localhost.key;

    location /media {
        aio threads=default;
        alias /usr/share/nginx/html/media;
        try_files $uri =404;
    }
}